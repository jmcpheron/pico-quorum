400" fill="#F2F4F7" text-anchor="middle">"PicoQuorum brand v1"</text><text x="469" y="220" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#FFB830" text-anchor="middle">‖ record )</text><line x1="598" y1="195" x2="640" y2="195" stroke="#98A0AC" stroke-width="2" marker-end="url(#a)"/><rect x="664" y="160" width="144" height="64" rx="8" fill="#14204A" stroke="#7A92FF" stroke-width="2"/><rect x="650" y="178" width="18" height="28" rx="3" fill="#C9CED6" stroke="#C9CED6" stroke-width="1.5"/><rect x="734" y="178" width="26" height="26" rx="2" fill="#111" stroke="#444" stroke-width="1.5"/><text x="747" y="195" font-family="Inter, Helvetica, Arial, sans-serif" font-size="7" font-weight="400" fill="#98A0AC" text-anchor="middle">608C</text><g transform="translate(768,174) scale(1.15)"><polygon points="16,4 23.05,25.71 8.95,25.71" fill="#5FDE7E"/><circle cx="16" cy="4" r="3" fill="#34C759"/><circle cx="27.41" cy="12.29" r="2" fill="#FFB830"/><circle cx="23.05" cy="25.71" r="3" fill="#34C759"/><circle cx="8.95" cy="25.71" r="3" fill="#34C759"/><circle cx="4.59" cy="12.29" r="2" fill="#FFB830"/></g><text x="736" y="244" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#7A92FF" text-anchor="middle">key 0000 signs</text><text x="736" y="261" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#98A0AC" text-anchor="middle">the brand key</text><line x1="812" y1="192" x2="862" y2="192" stroke="#98A0AC" stroke-width="2" marker-end="url(#a)"/><text x="870" y="188" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#7A92FF" text-anchor="start">r ‖ s</text><text x="870" y="206" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#98A0AC" text-anchor="start">64 B, low s</text><rect x="32" y="320" width="936" height="74" rx="10" fill="#161A21" stroke="#2A303A" stroke-width="1.5"/><text x="52" y="310" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#F2F4F7" text-anchor="start">slot 8 · 416 bytes</text><rect x="52" y="336" width="137.846" height="42" rx="4" fill="#7A92FF40" stroke="#7A92FF" stroke-width="1.5"/><text x="120.923" y="362" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#F2F4F7" text-anchor="middle">r ‖ s · 64 B</text><rect x="191.846" y="336" width="342.615" height="42" rx="4" fill="#0B0D11" stroke="#7A92FF" stroke-width="1.5" stroke-dasharray="4 3"/><text x="362.154" y="355" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#7A92FF" text-anchor="middle">bench certificate · 160 B</text><text x="362.154" y="371" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#98A0AC" text-anchor="middle">kept for a second bench: zeros for now</text><rect x="536.462" y="336" width="411.538" height="42" rx="4" fill="#3A414C40" stroke="#3A414C" stroke-width="1.5"/><text x="741.231" y="362" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#98A0AC" text-anchor="middle">zeros</text><path d="M890 220 C 900 310, 200 260, 102 332" fill="none" stroke="#98A0AC" stroke-width="2" marker-end="url(#a)"/><text x="32" y="430" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#98A0AC" text-anchor="start">The console checks it at U1: the signature under the pinned key 0000; the record's serial, revision and CRC against the chip; both zones locked;</text><text x="32" y="450" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#98A0AC" text-anchor="start">bench 0 with no certificate. The label's picture is the blockie of the digest's first 20 bytes.</text>
