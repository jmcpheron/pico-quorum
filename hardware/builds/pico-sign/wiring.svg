<text x="24.0" y="790.0" font-size="11.5" text-anchor="start" fill="#333">One press of the knob opens; a turn moves. On a review the sign switch is Sign: held 2 s (3 s when a page is red).</text>
<text x="24.0" y="807.0" font-size="11.5" text-anchor="start" fill="#333">The knob's push on the Sign row signs too (build1's rules). No Reject button: not signing is all a cosigner can do.</text>
<text x="24.0" y="824.0" font-size="11.5" text-anchor="start" fill="#333">Pull-ups: key-c has none of its own. 4.7k from D+ and from D- to VBUS (which is 3V3), at the plug.</text>
<text x="24.0" y="841.0" font-size="11.5" text-anchor="start" fill="#333">The key is powered whenever the Pico is: no switch, no current limit, as on the Feather pigtail.</text>
</svg>
