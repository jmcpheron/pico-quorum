<circle cx="498" cy="128" r="5" fill="#222222"/>
<text x="498" y="116" text-anchor="middle">GND</text>
<polyline points="498,128 498,162 559.2,162 559.2,584.0 195.7,584.0 195.7,451.3" fill="none" stroke="#222222" stroke-width="2.5" stroke-linejoin="round"/>
<circle cx="544" cy="128" r="5" fill="#2a9d3a"/>
<text x="544" y="116" text-anchor="middle">D+</text>
