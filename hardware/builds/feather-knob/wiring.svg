<text x="590" y="116" text-anchor="middle">D-</text>
<polyline points="590.0,128.0 590.0,178.0 447.2,178.0 447.2,254.4" fill="none" stroke="#7a5cc7" stroke-width="2.5" stroke-linejoin="round"/>
