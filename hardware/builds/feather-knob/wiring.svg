<circle cx="225" cy="655" r="22" fill="#cfcfcf" stroke="#888"/>
<text x="340" y="650" font-weight="bold">EC11 knob, 20 detents</text>
<text x="340" y="664" fill="#555" font-size="9">A C B on one side (C in the middle),</text>
<text x="340" y="676" fill="#555" font-size="9">the push D E on the other</text>
<circle cx="200" cy="610" r="5" fill="#2e7dd7"/>
<text x="200" y="626" text-anchor="middle">A</text>
<polyline points="200.0,610.0 200.0,520.0 241.4,520.0 241.4,451.3" fill="none" stroke="#2e7dd7" stroke-width="2.5" stroke-linejoin="round"/>
<circle cx="225" cy="610" r="5" fill="#222222"/>
<text x="225" y="626" text-anchor="middle">C</text>
<polyline points="225.0,610.0 225.0,530.0 195.7,530.0 195.7,451.3" fill="none" stroke="#222222" stroke-width="2.5" stroke-linejoin="round"/>
<circle cx="250" cy="610" r="5" fill="#1f9e6f"/>
<text x="250" y="626" text-anchor="middle">B</text>
<polyline points="250.0,610.0 250.0,540.0 264.3,540.0 264.3,451.3" fill="none" stroke="#1f9e6f" stroke-width="2.5" stroke-linejoin="round"/>
<circle cx="212" cy="700" r="5" fill="#d7832e"/>
<text x="212" y="692" text-anchor="middle">D</text>
<polyline points="212,700 212,716 320,716 320,552 287.2,552 287.2,451.3" fill="none" stroke="#d7832e" stroke-width="2.5" stroke-linejoin="round"/>
<circle cx="238" cy="700" r="5" fill="#222222"/>
<text x="238" y="692" text-anchor="middle">E</text>
<polyline points="238,700 238,716 130,716 130,562 195.7,562 195.7,451.3" fill="none" stroke="#222222" stroke-width="2.5" stroke-linejoin="round"/>
<text x="20" y="78" fill="#333" font-size="10.5">Knob: A to A1 (GPIO17), B to A2 (GPIO16),</text>
<text x="20" y="93" fill="#333" font-size="10.5">the push's D to A3 (GPIO15); C and E to GND.</text>
<text x="20" y="108" fill="#333" font-size="10.5">Key adapter: VBUS to 3V, never USB or BAT;</text>
<text x="20" y="123" fill="#333" font-size="10.5">GND to GND, D+ to SDA (42), D- to SCL (41).</text>
<text x="20" y="138" fill="#333" font-size="10.5">One GND pin for three wires: join C and E</text>
<text x="20" y="153" fill="#333" font-size="10.5">at the knob, then splice in the adapter's GND.</text>
</svg>
