<text x="277.4" y="218.2" text-anchor="start" fill="#999" font-size="8">18/26</text>
<circle cx="265.4" cy="238.6" r="7" fill="#000" stroke="#d4a017" stroke-width="2"/>
<text x="277.4" y="238.6" text-anchor="start" fill="#888" font-weight="normal">A1</text>
<text x="277.4" y="248.6" text-anchor="start" fill="#999" font-size="8">17/25</text>
