<text x="277.4" y="269.1" text-anchor="start" fill="#888" font-weight="normal">A2</text>
<text x="277.4" y="279.1" text-anchor="start" fill="#999" font-size="8">9/27</text>
<circle cx="265.4" cy="299.6" r="7" fill="#000" stroke="#d4a017" stroke-width="2"/>
<text x="277.4" y="299.6" text-anchor="start" fill="#888" font-weight="normal">A3</text>
<text x="277.4" y="309.6" text-anchor="start" fill="#999" font-size="8">8/15</text>
