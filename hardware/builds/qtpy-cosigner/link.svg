<svg xmlns="http://www.w3.org/2000/svg" width="800" height="650" viewBox="0 0 800 650" font-family="Helvetica, Arial, sans-serif" font-size="11">
<rect width="800" height="650" fill="#ffffff"/>
<text x="20" y="28" font-size="16" font-weight="bold">The QT Py cosigner, later: the link on a USB serial bridge</text>
<text x="20" y="46" fill="#555">The phone reaches only UART1. The QT Py's own USB-C stays empty. Screen, key and buttons as in wiring.svg.</text>
<rect x="250" y="170" width="213.6" height="259.2" rx="18.0" fill="#1d1d1d"/>
<rect x="302.8" y="152.0" width="108.0" height="50.4" fill="#9a9a9a" rx="3"/>
<text x="356.8" y="171.2" text-anchor="middle" font-size="10">USB-C</text>
<text x="356.8" y="189.2" text-anchor="middle" fill="#333" font-size="9">leave empty</text>
<rect x="313.6" y="275.6" width="86.4" height="67.2" fill="#3a3a3a" stroke="#666"/>
<text x="356.8" y="305.6" text-anchor="middle" fill="#eee" font-size="9">ESP32-S3</text>
<text x="356.8" y="320.0" text-anchor="middle" fill="#aaa" font-size="8">or ESP32 Pico</text>
