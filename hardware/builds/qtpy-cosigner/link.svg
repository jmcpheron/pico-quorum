<text x="277.4" y="370.6" text-anchor="start" fill="#999" font-size="8">6/33</text>
<circle cx="265.4" cy="391.0" r="7" fill="#000" stroke="#d4a017" stroke-width="2"/>
<text x="277.4" y="391.0" text-anchor="start" fill="#888" font-weight="normal">TX</text>
<text x="277.4" y="401.0" text-anchor="start" fill="#999" font-size="8">5/32</text>
<circle cx="448.2" cy="208.2" r="7" fill="#d4a017" stroke="#d4a017" stroke-width="2"/>
<text x="436.2" y="212.2" text-anchor="end" fill="#fff" font-weight="bold">5V</text>
