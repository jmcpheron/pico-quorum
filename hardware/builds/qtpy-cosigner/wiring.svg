<text x="608" y="128" font-weight="bold">SPI screen</text>
<text x="608" y="142" fill="#555" font-size="9">ST7789 or ST7735, 3.3 V</text>
<text x="608" y="156" fill="#555" font-size="9">pin order varies: go by</text>
<text x="608" y="168" fill="#555" font-size="9">the labels on yours</text>
<circle cx="600" cy="238.6" r="5" fill="#222222"/>
<text x="609" y="242.6" font-size="10">GND</text>
