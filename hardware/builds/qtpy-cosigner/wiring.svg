<polyline points="258.4,299.6 136.0,299.6 136.0,640.0 504.0,640.0 504.0,420.0 600.0,420.0" fill="none" stroke="#c2185b" stroke-width="2.5" stroke-linejoin="round"/>
<circle cx="600" cy="445.0" r="5" fill="#8a6d3b"/>
