<circle cx="189" cy="377.0" r="5" fill="#6b8e23"/>
<text x="130" y="381.0" text-anchor="end" font-weight="bold">D1</text>
<text x="130" y="392.0" text-anchor="end" fill="#555" font-size="9">Next</text>
<polyline points="258.4,391.0 230.0,391.0 230.0,377.0 206.0,377.0" fill="none" stroke="#6b8e23" stroke-width="2.5" stroke-linejoin="round"/>
<polyline points="172.0,377.0 156.0,377.0" fill="none" stroke="#222" stroke-width="2.5" stroke-linejoin="round"/>
<line x1="156.0" y1="377.0" x2="156.0" y2="387.0" stroke="#222" stroke-width="2.5"/>
<line x1="147.0" y1="387.0" x2="165.0" y2="387.0" stroke="#222" stroke-width="2"/>
<line x1="150.0" y1="391.0" x2="162.0" y2="391.0" stroke="#222" stroke-width="2"/>
<line x1="153.0" y1="395.0" x2="159.0" y2="395.0" stroke="#222" stroke-width="2"/>
<text x="20" y="712" fill="#333" font-size="10.5">Screen: CS A0, DC A1, RST A2, BL A3; its SCL to SCK and its MOSI (or SDA) to MO.</text>
<text x="20" y="728" fill="#333" font-size="10.5">Its SCL is the SPI clock: never the QT Py's SCL pad. 3V3 to 3V, never 5V.</text>
<text x="20" y="744" fill="#333" font-size="10.5">Buttons to GND, read with the chip's own pull-ups: D0 (Reject) on SDA, D1 (Next) on TX, D2 (Sign) on SCL.</text>
<text x="20" y="760" fill="#333" font-size="10.5">Boot is not read. The QT Py has one GND pad: every ground symbol is that pad.</text>
<text x="20" y="776" fill="#333" font-size="10.5">The key is on the STEMMA QT port, a bus of its own; the SDA and SCL pads are not it.</text>
</svg>
