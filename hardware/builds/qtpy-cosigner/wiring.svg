<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" font-family="Helvetica, Arial, sans-serif" font-size="11">
<rect width="800" height="800" fill="#ffffff"/>
<text x="20" y="28" font-size="16" font-weight="bold">The QT Py cosigner: QT Py ESP32, SPI screen, ATECC608 breakout, three buttons</text>
<text x="20" y="46" fill="#555">Seen from the top, USB-C up. Small numbers: GPIO on the S3 / on the ESP32 Pico. Go by the silkscreen labels.</text>
