<text x="293" y="517" fill="#555" font-size="9">I2C 0x60, the key</text>
<text x="293" y="585" fill="#555" font-size="9">SDA1 41/22, SCL1 40/19</text>
<line x1="350.8" y1="418.4" x2="350.8" y2="485" stroke="#222222" stroke-width="2.5"/>
<line x1="354.8" y1="418.4" x2="354.8" y2="485" stroke="#d0312d" stroke-width="2.5"/>
<line x1="358.8" y1="418.4" x2="358.8" y2="485" stroke="#2e7dd7" stroke-width="2.5"/>
<line x1="362.8" y1="418.4" x2="362.8" y2="485" stroke="#f0c020" stroke-width="2.5"/>
<text x="370.8" y="463" fill="#555" font-size="9">STEMMA QT cable, from the port on the back</text>
<rect x="172" y="306.1" width="34" height="20" rx="3" fill="#eee" stroke="#c62828" stroke-width="2"/>
<circle cx="189" cy="316.1" r="5" fill="#c62828"/>
<text x="130" y="320.1" text-anchor="end" font-weight="bold">D0</text>
<text x="130" y="331.1" text-anchor="end" fill="#555" font-size="9">Reject</text>
<polyline points="258.4,330.1 230.0,330.1 230.0,316.1 206.0,316.1" fill="none" stroke="#c62828" stroke-width="2.5" stroke-linejoin="round"/>
<polyline points="172.0,316.1 156.0,316.1" fill="none" stroke="#222" stroke-width="2.5" stroke-linejoin="round"/>
<line x1="156.0" y1="316.1" x2="156.0" y2="326.1" stroke="#222" stroke-width="2.5"/>
